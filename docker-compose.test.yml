# Тестовый стенд: Postgres (вместо Supabase) и n8n той же версии, что в проде.
# Поднимает и импортирует workflow фикстура tests/stand.py, руками — см. README.
# Порты хоста случайные (0): параллельные стенды не пересекаются, адрес узнаём через `docker compose port`.
# Имя проекта — COMPOSE_PROJECT_NAME (фикстура задаёт своё на каждый checkout).
# EspoCRM (образ deploy/espocrm, как в проде) поднимает только фикстура `espocrm`: база `espocrm`
# в том же Postgres, установка с нуля на каждый прогон. Имя образа не задано: compose называет его
# по проекту, и стенды разных checkout'ов не перетирают модуль друг другу.

x-espocrm: &espocrm
  build: deploy/espocrm
  # Daemon и WebSocket выходят, если основной контейнер ещё не готов.
  restart: unless-stopped
  volumes_from:
    - espocrm
  depends_on:
    espocrm:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "127.0.0.1:${STAND_POSTGRES_PORT:-0}:5432"
    healthcheck:
      # По TCP: на время initdb образ поднимает временный сервер только на unix-сокете,
      # проверка через сокет зеленеет раньше, чем Postgres готов принимать соединения с хоста.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "test"]
      interval: 1s
      retries: 30

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.45.1}
    environment:
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Под нагрузкой (параллельные стенды) task runner стартует дольше 30 с по умолчанию,
      # не подключается к брокеру, и Code-узлы падают по таймауту.
      N8N_RUNNERS_GRANT_TOKEN_TTL: "300"
      GENERIC_TIMEZONE: Europe/Warsaw
      # Ключ фиксирован: стенд одноразовый, credentials тестовые.
      N8N_ENCRYPTION_KEY: test-stand-encryption-key
      # Из него scripts/n8n_sync.py собирает credentials Postgres, как из .env в проде.
      DATABASE_URL: postgresql://test:test@postgres:5432/test?sslmode=disable
      # Секреты: тестовые значения.
      META_APP_SECRET: test-app-secret
      META_VERIFY_TOKEN: test-verify-token
      META_PAGE_ACCESS_TOKEN: test-page-token
      WHATSAPP_ACCESS_TOKEN: test-whatsapp-token
      INSTAGRAM_ACCESS_TOKEN: test-instagram-token
      OPENROUTER_API_KEY: test-openrouter-key
      TELEGRAM_BOT_TOKEN: test-telegram-token
      # Группа разработчиков для алерта «AI не отвечает».
      ALERT_TELEGRAM_CHAT_ID: "-1009990000000"
      RETRY_WEBHOOK_SECRET: test-retry-secret
      ESPOCRM_API_KEY: test-espocrm-key
      EMPLOYEE_REPLY_SECRET: test-employee-reply-secret
      REPORT_WEBHOOK_SECRET: test-report-secret
      # Отчёты владельцу: письма уходят в Mailpit стенда, он принимает любой логин.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: test-smtp-user
      SMTP_PASSWORD: test-smtp-password
      SMTP_FROM: raporty@uala.test
      OWNER_REPORT_EMAIL: wlasciciel@autopro.test
      # Отчёты по расписанию в тестах не срабатывают (1 января): прогоны только по вебхуку.
      REPORT_DAILY_CRON: "0 0 1 1 *"
      REPORT_WEEKLY_CRON: "0 0 1 1 *"
      SMSAPI_TOKEN: test-smsapi-token
      # Расписания retry и напоминаний в тестах не срабатывают (1 января): прогоны только по вебхуку.
      RETRY_SCHEDULE_CRON: ${RETRY_SCHEDULE_CRON:-0 0 1 1 *}
      REMINDER_SCHEDULE_CRON: ${REMINDER_SCHEDULE_CRON:-0 0 1 1 *}
      MARKETING_SCHEDULE_CRON: ${MARKETING_SCHEDULE_CRON:-0 0 1 1 *}
      # Внешние API — фейк-сервер pytest на хосте (tests/fake_server.py).
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-http://host.docker.internal:9/openrouter}
      META_GRAPH_BASE_URL: ${META_GRAPH_BASE_URL:-http://host.docker.internal:9/meta}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-http://host.docker.internal:9/telegram}
      ESPOCRM_BASE_URL: ${ESPOCRM_BASE_URL:-http://host.docker.internal:9/espocrm}
      SMSAPI_BASE_URL: ${SMSAPI_BASE_URL:-http://host.docker.internal:9/smsapi}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${STAND_N8N_PORT:-0}:5678"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  # SMTP-сервер для писем n8n: принимает всё, ничего не отправляет, письма читаются через его API.
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${STAND_MAILPIT_PORT:-0}:8025"

  espocrm:
    build: deploy/espocrm
    environment:
      ESPOCRM_DATABASE_PLATFORM: Postgresql
      ESPOCRM_DATABASE_HOST: postgres
      ESPOCRM_DATABASE_PORT: "5432"
      ESPOCRM_DATABASE_NAME: espocrm
      ESPOCRM_DATABASE_USER: test
      ESPOCRM_DATABASE_PASSWORD: test
      ESPOCRM_ADMIN_USERNAME: admin
      ESPOCRM_ADMIN_PASSWORD: test-espocrm-admin
      ESPOCRM_SITE_URL: http://localhost
      ESPOCRM_LANGUAGE: pl_PL
      ESPOCRM_TIME_ZONE: Europe/Warsaw
      # WebSocket: сервер в espocrm-websocket, адрес для браузера стенду не нужен.
      ESPOCRM_CONFIG_USE_WEB_SOCKET: "true"
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBSCRIBER_DSN: tcp://*:7777
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBMISSION_DSN: tcp://espocrm-websocket:7777
      # Ответ сотрудника, закрытая Задача и статус Заказ-наряда (хуки модуля Uala): контрактные тесты
      # подставляют фейк-сервер.
      ESPOCRM_CONFIG_UALA_EMPLOYEE_REPLY_URL: ${EMPLOYEE_REPLY_URL:-http://n8n:5678/webhook/employee-reply}
      ESPOCRM_CONFIG_UALA_TASK_DONE_URL: ${TASK_DONE_URL:-http://n8n:5678/webhook/task-done}
      ESPOCRM_CONFIG_UALA_REPAIR_STATUS_URL: ${REPAIR_STATUS_URL:-http://n8n:5678/webhook/repair-status}
      ESPOCRM_CONFIG_UALA_EMPLOYEE_REPLY_SECRET: test-employee-reply-secret
    volumes:
      - /var/www/html/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${STAND_ESPOCRM_PORT:-0}:80"
    # Apache стартует после установки: до неё app-check уже проходит, а API ещё нет.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 2s
      retries: 150
    depends_on:
      postgres:
        condition: service_healthy

  espocrm-daemon:
    <<: *espocrm
    entrypoint: docker-daemon.sh

  espocrm-websocket:
    <<: *espocrm
    entrypoint: docker-websocket.sh
    ports:
      - "127.0.0.1:${STAND_ESPOCRM_WEBSOCKET_PORT:-0}:8080"
