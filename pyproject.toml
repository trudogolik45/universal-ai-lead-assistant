[project]
name = "universal-ai-lead-assistant"
version = "0.1.0"
description = "AI-ассистент заявок в мессенджере: схема, сиды, тесты"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
